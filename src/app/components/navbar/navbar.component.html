<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container-fluid">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center" (click)="navigateToHome()" style="cursor: pointer;">
      <div class="brand-logo me-2">
        <i class="bi bi-shop text-white"></i>
      </div>
      <span class="brand-text fw-bold text-white">FurniCraft</span>
    </a>

    <!-- Mobile Toggle Button -->
    <button class="navbar-toggler border-0"
            type="button"
            (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Items -->
    <div class="collapse navbar-collapse" [class.show]="isMenuOpen">

      <!-- Mobile Search Bar -->


      <!-- Main Navigation Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" (click)="navigateToHome()" style="cursor: pointer;">
            <i class="bi bi-house me-1"></i>Home
          </a>
        </li>
        <li class="nav-item dropdown">
          <!-- <a class="nav-link dropdown-toggle"
             href="#"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false">
            <i class="bi bi-grid me-1"></i>Categories
          </a> -->
          <ul class="dropdown-menu">
            <li *ngFor="let category of categories">
              <a class="dropdown-item" (click)="navigateToCategory(category.route)" style="cursor: pointer;">
                <i [class]="category.icon + ' me-2 text-white'"></i>
                {{category.name}}
              </a>
            </li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link" (click)="navigateToProducts()" style="cursor: pointer;">
            <i class="bi bi-box me-1"></i>All Products
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" (click)="navigateToOffers()" style="cursor: pointer;">
            <i class="bi bi-tag me-1"></i>Special Offers
          </a>
        </li>

        <!-- Search Bar (Desktop) -->
        <li class="nav-item d-none d-md-block ms-3">
          <div class="search-container">
            <div class="input-group">
              <input type="text"
                     class="form-control search-input"
                     placeholder="Search furniture, decor..."
                     [(ngModel)]="searchTerm"
                     (keyup.enter)="onSearch()">
              <button class="btn btn-wood" type="button" (click)="onSearch()">
                <i class="bi bi-search text-white"></i>
              </button>
            </div>
          </div>
        </li>
      </ul>

      <div class="d-md-none mt-3 mb-3">
        <div class="input-group">
          <input type="text"
                 class="form-control"
                 placeholder="Search products..."
                 [(ngModel)]="searchTerm"
                 (keyup.enter)="onSearch()">
          <button class="btn btn-wood" type="button" (click)="onSearch()">
            <i class="bi bi-search text-white"></i>
          </button>
        </div>
      </div>

      <!-- Right Side Items -->
      <div class="navbar-nav ms-auto">

        <!-- Wishlist -->
        <div class="nav-item me-3">
          <button class="btn btn-link nav-link border-0 p-0 position-relative"
                  (click)="navigateToWishlist()">
            <i class="bi bi-heart text-danger"></i>
            <span class="wishlist-text d-none d-lg-inline ms-1">Wishlist</span>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  *ngIf="(wishlistItemCount$ | async) as count; else: noWishlistCount"
                  [style.display]="count > 0 ? 'inline' : 'none'">
              {{count}}
            </span>
            <ng-template #noWishlistCount></ng-template>
          </button>
        </div>

        <!-- Cart -->
        <div class="nav-item me-3">
          <button class="btn btn-link nav-link border-0 p-0 position-relative"
                  (click)="navigateToCart()">
            <i class="bi bi-cart3 text-white"></i>
            <span class="cart-text d-none d-lg-inline ms-1">Cart</span>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-wood"
                  *ngIf="(cartItemCount$ | async) as count; else: noCartCount"
                  [style.display]="count > 0 ? 'inline' : 'none'">
              {{count}}
            </span>
            <ng-template #noCartCount></ng-template>
          </button>
        </div>

        <!-- User Menu - Logged In -->
        <div class="nav-item dropdown" *ngIf="isLoggedIn">
          <a class="nav-link dropdown-toggle d-flex align-items-center"
             href="#"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false">
            <i class="bi bi-person-circle me-1"></i>
            <span class="d-none d-lg-inline">{{userName || 'Account'}}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <h6 class="dropdown-header">
                <i class="bi bi-person me-2"></i>
                Welcome, {{userName || 'User'}}!
              </h6>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" (click)="navigateToProfile()" style="cursor: pointer;">
                <i class="bi bi-person me-2"></i>My Profile
              </a>
            </li>
            <li>
              <a class="dropdown-item" (click)="navigateToOrders()" style="cursor: pointer;">
                <i class="bi bi-bag-check me-2"></i>My Orders
              </a>
            </li>
            <li>
              <a class="dropdown-item" (click)="navigateToWishlist()" style="cursor: pointer;">
                <i class="bi bi-heart me-2"></i>My Wishlist
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" href="#" style="cursor: pointer;">
                <i class="bi bi-headset me-2"></i>Help & Support
              </a>
            </li>
            <li>
              <a class="dropdown-item text-danger" (click)="logout()" style="cursor: pointer;">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>

        <!-- Login Button - Not Logged In -->
        <div class="nav-item d-flex align-items-center" *ngIf="!isLoggedIn">
          <button class="btn btn-outline-light btn-sm" (click)="navigateToLogin()">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            <span class="d-none d-lg-inline">Login</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>




<!-- Category Pills (Optional - shows on larger screens) -->
<div class="bg-dark-wood border-bottom d-none d-lg-block" style="background: linear-gradient(135deg, #2d1a0f 0%, #3c2415 100%);">
  <div class="container-fluid">
    <div class="d-flex justify-content-center py-2">
      <div class="category-pills">
        <button class="btn btn-sm btn-outline-wood me-2 mb-1"
                *ngFor="let category of categories"
                (click)="navigateToCategory(category.route)"
                style="border-color: rgba(210, 105, 30, 0.5); color: #ffffff;">
          <i [class]="category.icon + ' me-1'"></i>
          {{category.name}}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Top Announcement Bar (Optional) -->
<div class="text-white text-center py-1 d-none d-md-block" style="background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);">
  <small>
    <i class="bi bi-truck me-1"></i>
    Free assembly on orders above ₹25,000 |
    <i class="bi bi-telephone ms-2 me-1"></i>
    24/7 Customer Support: 1800-123-4567
  </small>
</div>
