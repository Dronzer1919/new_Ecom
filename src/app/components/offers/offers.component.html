<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">
      <h2 class="h3 mb-4">Special Offers</h2>
      <p class="text-muted mb-4">Don't miss out on these amazing deals!</p>

      <div class="row g-4">
        <div class="col-lg-4 col-md-6" *ngFor="let offer of offers">
          <div class="card offer-card h-100">
            <div class="position-relative">
              <img [src]="offer.image" class="card-img-top" style="height: 200px; object-fit: cover;">
              <div class="position-absolute top-0 end-0 m-3">
                <span class="badge bg-danger fs-6">{{offer.discount}}</span>
              </div>
            </div>
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{offer.title}}</h5>
              <p class="card-text">{{offer.description}}</p>
              <div class="mt-auto">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div>
                    <strong>Code: {{offer.code}}</strong>
                  </div>
                  <small class="text-muted">Valid till {{offer.validTill | date:'mediumDate'}}</small>
                </div>
                <button class="btn btn-success w-100">
                  <i class="bi bi-tag me-2"></i>Use This Offer
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
