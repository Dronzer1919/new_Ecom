<div class="container-fluid py-4">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <h2 class="h3 mb-4">My Profile</h2>

      <div class="card">
        <div class="card-body">
          <div class="row">
            <div class="col-md-4 text-center mb-4">
              <img [src]="user.avatar" class="rounded-circle mb-3" style="width: 120px; height: 120px; object-fit: cover;">
              <h5>{{user.name}}</h5>
              <button class="btn btn-outline-primary btn-sm">Change Photo</button>
            </div>
            <div class="col-md-8">
              <h6>Personal Information</h6>
              <div class="row mb-3">
                <div class="col-sm-3"><strong>Name:</strong></div>
                <div class="col-sm-9">{{user.name}}</div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-3"><strong>Email:</strong></div>
                <div class="col-sm-9">{{user.email}}</div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-3"><strong>Phone:</strong></div>
                <div class="col-sm-9">{{user.phone}}</div>
              </div>
              <button class="btn btn-primary">Edit Profile</button>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center">
              <i class="bi bi-bag-check h2 text-success"></i>
              <h6>My Orders</h6>
              <p class="text-muted">View your order history</p>
              <button class="btn btn-outline-success" routerLink="/orders">View Orders</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-body text-center">
              <i class="bi bi-heart h2 text-danger"></i>
              <h6>My Wishlist</h6>
              <p class="text-muted">Items you want to buy later</p>
              <button class="btn btn-outline-danger" routerLink="/wishlist">View Wishlist</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
