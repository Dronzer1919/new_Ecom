<div class="container mt-4">
  <h2>User Management</h2>

  <!-- Users Table -->
  <ngx-datatable
    class="material striped"
    [rows]="users"
    [headerHeight]="50"
    [rowHeight]="'auto'"
    [columnMode]="'force'"
  >
    <ngx-datatable-column name="Email" [sortable]="true" [resizeable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.email }}
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Role" [sortable]="true" [resizeable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        {{ row.role }}
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="Actions" [sortable]="false" [resizeable]="true">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <button class="btn btn-outline-primary me-2" (click)="editUser(row)" data-bs-toggle="modal" data-bs-target="#addUserModal">
          Edit
        </button>
        <button class="btn btn-outline-danger" (click)="deleteUser(row._id)" data-bs-toggle="modal" data-bs-target="#deleteUserModal">
          Delete
        </button>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>

  <!-- Add New User Button -->
  <button class="btn btn-success mb-3" (click)="openAddUserModal()" data-bs-toggle="modal" data-bs-target="#addUserModal">
    Add New User
  </button>

  <!-- Add/Edit User Modal -->
  <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addUserModalLabel">{{ selectedUser ? 'Edit' : 'Add' }} User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="userForm" (ngSubmit)="saveUser()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" id="email" required>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Role</label>
              <select class="form-select" formControlName="role" id="role" required>
                <option value="">Select Role</option>
                <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="password" id="password" required>
            </div>

            <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete User Confirmation Modal -->
  <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to delete this user?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" (click)="confirmDeleteUser()">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
